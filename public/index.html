<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>峡谷锐评官</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="style.css" />
  <script src="/vendor/html2canvas.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- 动态背景：极光 + 海克斯符文阵 + 金色光点，全部原创绘制 -->
  <div class="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <svg class="rune" viewBox="-200 -200 400 400">
      <g class="ring-outer">
        <circle r="190" />
        <circle r="178" stroke-dasharray="2 10" />
        <path d="M0 -190 L0 -166 M0 190 L0 166 M-190 0 L-166 0 M190 0 L166 0" />
        <path d="M134 -134 L118 -118 M-134 134 L-118 118 M134 134 L118 118 M-134 -134 L-118 -118" />
      </g>
      <g class="ring-inner">
        <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" />
        <polygon points="0,-120 104,60 -104,60" />
        <polygon points="0,120 104,-60 -104,-60" />
        <circle r="70" stroke-dasharray="14 6" />
        <circle r="40" />
      </g>
    </svg>
    <canvas id="sparks"></canvas>
    <div class="vignette"></div>
  </div>

  <header class="top">
    <div class="brand">
      <span class="logo">锐</span>
      <div>
        <h1>峡谷<em>锐评官</em></h1>
        <p>上传战绩，抽一位锐评官来评你</p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="roast" role="tab">🎴 锐评我</button>
    <button class="tab" data-tab="blame" role="tab">⚔️ 战犯评选</button>
    <button class="tab" data-tab="dex" role="tab">📖 图鉴 <span class="badge" id="dexBadge">0</span></button>
  </nav>

  <main>
    <!-- 锐评我 -->
    <section class="panel" id="tab-roast">
      <div class="input-card">
        <div id="roastImageMode">
          <label class="drop" data-drop="roast">
            <input type="file" accept="image/png,image/jpeg,image/webp" />
            <img alt="" hidden />
            <span class="drop-hint">
              <b>📸 点击选择或拖入战绩截图</b>
              <small>掌盟 / WeGame 战绩列表、客户端生涯页、单局结算页都行</small>
            </span>
          </label>
          <button type="button" class="link" id="toNameMode">没有截图？用召唤师名或演示数据 →</button>
        </div>
        <div id="roastNameMode" hidden>
          <div class="notice" id="demoNotice" hidden>还没接入 Riot 数据，随便输个名字体验<b>演示数据</b>。</div>
          <div class="row">
            <label>召唤师名（名字#标签）<input id="riotId" placeholder="Faker#KR1" autocomplete="off" /></label>
            <label>服务器<select id="server"></select></label>
          </div>
          <button type="button" class="link" id="toImageMode">← 还是传截图</button>
        </div>
        <div class="tones" data-tones="roast"></div>
        <button class="primary big" id="roastBtn">🎲 抽一位锐评官</button>
        <p class="error" id="roastError"></p>
      </div>

      <div id="roastResult" hidden>
        <div class="stage" id="stage"></div>
        <div class="actions">
          <button class="primary" id="saveCard">💾 保存卡片</button>
          <button class="ghost" id="rerollBtn">🎲 再抽一次</button>
        </div>

        <div class="chat" id="chat">
          <h3>不服？跟锐评官对线</h3>
          <div class="bubbles" id="bubbles"></div>
          <form class="chat-input" id="chatForm">
            <input id="chatText" maxlength="100" placeholder="比如：我玩辅助的补刀低很正常好吧" autocomplete="off" />
            <button class="primary" type="submit">回嘴</button>
          </form>
        </div>

        <div id="reportArea" hidden>
          <h3>赛后分析报告</h3>
          <p class="hint">选一场对局，看看这局输在哪、赢在哪</p>
          <div class="matches" id="matches"></div>
          <div id="report" hidden></div>
        </div>
      </div>
    </section>

    <!-- 战犯评选 -->
    <section class="panel" id="tab-blame" hidden>
      <div class="input-card">
        <label class="drop" data-drop="blame">
          <input type="file" accept="image/png,image/jpeg,image/webp" />
          <img alt="" hidden />
          <span class="drop-hint">
            <b>⚔️ 上传一局的结算截图</b>
            <small>锐评官给我方五人排名，评出 MVP 和战犯，发到开黑群里</small>
          </span>
        </label>
        <div class="tones" data-tones="blame"></div>
        <button class="primary big" id="blameBtn">⚖️ 开始评选</button>
        <p class="error" id="blameError"></p>
      </div>
      <div id="blameResult" hidden>
        <div id="blameCard"></div>
        <div class="actions single">
          <button class="primary" id="saveBlame">💾 保存图片发群里</button>
        </div>
      </div>
    </section>

    <!-- 图鉴 -->
    <section class="panel" id="tab-dex" hidden>
      <div class="dex-head" id="dexHead"></div>
      <div class="dex-grid" id="dexGrid"></div>
      <div class="dex-detail" id="dexDetail" hidden></div>
    </section>
  </main>

  <footer class="site-foot">
    <p>截图仅用于识别，不会保存 · 锐评由 AI 生成，仅供娱乐</p>
    <p>非官方粉丝作品，与 Riot Games、腾讯无关 · <a href="https://github.com/XinyuZheng1878/LOL-Roast" target="_blank" rel="noopener">开源代码</a></p>
  </footer>

  <div class="loading" id="loading" hidden>
    <div class="loading-card"><span>?</span></div>
    <p id="loadingText"></p>
  </div>
</body>
</html>
