server {
    listen 80 default_server;
    server_name _;

    # 截图上传，限制在 10MB 以内
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 识图 + 锐评可能要十几秒
        proxy_read_timeout 120s;
    }
}
